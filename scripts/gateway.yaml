openapi: 3.0.0
info:
  title: ekp-parser
  version: "1.0"
paths:
  # Статика Next — прямо из Object Storage, минуя функцию. Бакет приватный:
  # шлюз отвечает 302 на ссылку, подписанную сервисным аккаунтом.
  /_next/static/{file+}:
    get:
      parameters:
        - { explode: false, in: path, name: file, required: true, schema: { type: string }, style: simple }
      x-yc-apigateway-integration:
        type: object_storage
        bucket: ${BUCKET}
        object: assets/_next/static/{file}
        presigned_redirect: true
        service_account_id: ${SA_ID}
  /:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${SA_ID}
        tag: $latest
  /{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - { explode: false, in: path, name: proxy, required: true, schema: { type: string }, style: simple }
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${SA_ID}
        tag: $latest
