name: Pages

# Статический сайт на GitHub Pages: next export + данные из data/dataset.json,
# зашифрованные паролем DATA_PASSWORD (секрет репозитория).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Sync]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # после Sync — свежий коммит с данными
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REPO: ${{ github.repository }}
        run: |
          if [ -z "$DATA_PASSWORD" ]; then echo "::error::не задан секрет DATA_PASSWORD — данные ушли бы на сайт открытыми"; exit 1; fi
          pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
