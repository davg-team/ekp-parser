name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Переменная репозитория RUNS_ON (напр. ["self-hosted","linux","x64"]) уводит джобу на свой раннер.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
